name: Release static binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/update (used only for manual runs)'
        required: false
        default: 'v0.1.0-manual'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test memory integration without hardware
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_memory.py' -v
          node tests/test_v2_memory.js
          python3 web/v2/build_markup.py --check
          bash tests/test_install_lib.sh
          bash -n install.sh install-lib.sh uninstall.sh

      - name: Build static apu_telemetry
        run: |
          if g++ -std=c++17 -Wall -Wextra -O2 -static -o apu_telemetry bc250_telemetry.cpp; then
            echo "Static build succeeded." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Static link failed, falling back to dynamic build — this binary may not run on distros without matching shared libs." >> "$GITHUB_STEP_SUMMARY"
            g++ -std=c++17 -Wall -Wextra -O2 -o apu_telemetry bc250_telemetry.cpp
          fi

      - name: Verify binary
        run: |
          file apu_telemetry
          ldd apu_telemetry || true

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package ready-to-run bundle
        run: |
          BUNDLE=bc250-telemetry
          mkdir -p "dist/$BUNDLE/web"
          cp apu_telemetry bc250_telemetry.cpp memory_telemetry.h install.sh install-lib.sh uninstall.sh apu-telemetry.service README.md LICENSE hardware.md "dist/$BUNDLE/"
          cp -r web/. "dist/$BUNDLE/web/"
          cp -r images memory "dist/$BUNDLE/"
          chmod +x "dist/$BUNDLE/apu_telemetry" "dist/$BUNDLE/install.sh" "dist/$BUNDLE/uninstall.sh"
          tar -C dist -czf bc250-telemetry.tar.gz "$BUNDLE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: bc250-telemetry.tar.gz
          generate_release_notes: true

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bc250-telemetry
          path: bc250-telemetry.tar.gz
