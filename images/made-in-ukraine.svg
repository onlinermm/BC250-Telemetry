<svg xmlns="http://www.w3.org/2000/svg" width="148" height="20" viewBox="0 0 148 20" role="img" aria-label="Made in Ukraine">
  <title>Made in Ukraine</title>
  <linearGradient id="shine" x2="0" y2="100%">
    <stop offset="0" stop-color="#fff" stop-opacity=".12"/>
    <stop offset="1" stop-opacity=".08"/>
  </linearGradient>
  <clipPath id="round">
    <rect width="148" height="20" rx="3"/>
  </clipPath>
  <g clip-path="url(#round)">
    <rect width="148" height="20" fill="#0057B7"/>
    <rect width="148" height="20" fill="url(#shine)"/>
  </g>
  <rect x="6" y="4" width="16" height="12" rx="1" fill="#fff"/>
  <rect x="7" y="5" width="14" height="5" fill="#0057B7"/>
  <rect x="7" y="10" width="14" height="5" fill="#FFD700"/>
  <text x="28" y="14" fill="#FFD700" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">Made in Ukraine</text>
</svg>
