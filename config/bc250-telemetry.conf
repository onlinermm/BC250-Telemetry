# BC-250 Telemetry configuration (/etc/bc250-telemetry.conf)
#
# Apply changes without reinstalling:   sudo systemctl reload apu-telemetry
# Check the file for typos:             apu_telemetry --check-config
#
# Every key is optional; a missing key, unknown key or invalid value falls
# back to the default shown here (and is reported in journalctl -u apu-telemetry).

# Where CPU/GPU VRM readings (voltage, current, power, temperature) come from:
#   auto  - the kernel bc250_vrm driver (hwmon) when it is loaded, otherwise
#           direct PMBus over I2C. Raw I2C is never used while a kernel driver
#           owns the VRM, so this works with or without bc250_vrm installed.
#   hwmon - only the kernel bc250_vrm driver
#   pmbus - only direct I2C (refused while a kernel driver owns the VRM;
#           blacklist bc250_vrm first if you really want this)
#   off   - no VRM telemetry, no I2C traffic at all
vrm_source = auto

# I2C bus for direct PMBus access: auto, or a number from `ls /dev/i2c-*`.
# auto tries only the AMD SMBus (PIIX4) adapters, port 0 first.
i2c_bus = auto

# Where GDDR6 memory temperatures come from:
#   auto      - the kernel bc250_memory driver (hwmon) when loaded, otherwise
#               bc250-memory.service (installed with ./install.sh --memory-temp)
#   hwmon     - only the kernel bc250_memory driver
#   collector - only bc250-memory.service
#   off       - no memory temperatures
# Never run the kernel driver and bc250-memory.service together.
memory_source = auto

# Main polling period in milliseconds (250..10000).
poll_interval_ms = 700

# How often the kernel bc250_memory driver is read, in ms (1000..10000).
# Each read costs eight SMU round-trips.
memory_poll_interval_ms = 3000

# Write /run/bc250/* sensor files for CoolerControl and MangoHud (on/off).
run_files = on
