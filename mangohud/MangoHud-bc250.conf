# BC-250 VRM temperatures from apu_telemetry.
# Paste into ~/.config/MangoHud/MangoHud.conf (or a per-game conf).
# custom_text / exec only work with the non-legacy layout.

legacy_layout=0
# custom_text/exec use font_secondary, which defaults to 0.55 * font_size.
font_size_secondary=24
custom_text=CPU VRM
exec=cat /run/bc250/cpu_vrm_c
custom_text=GPU VRM
exec=cat /run/bc250/gpu_vrm_c
