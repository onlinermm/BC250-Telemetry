# BC-250 PMBus/VRM metrics from apu_telemetry (not in hwmon).
# Paste into ~/.config/MangoHud/MangoHud.conf (or a per-game conf).
# custom_text / exec only work with the non-legacy layout.

legacy_layout=0
# custom_text/exec use font_secondary, which defaults to 0.55 * font_size.
font_size_secondary=24
custom_text=CPU VRM
exec=cat /run/bc250/cpu_vrm_c
custom_text=GPU VRM
exec=cat /run/bc250/gpu_vrm_c
custom_text=CPU VO
exec=cat /run/bc250/cpu_vout
custom_text=GPU VO
exec=cat /run/bc250/gpu_vout
custom_text=VIN
exec=cat /run/bc250/vin
custom_text=CPU IO
exec=cat /run/bc250/cpu_iout
custom_text=GPU IO
exec=cat /run/bc250/gpu_iout
custom_text=CPU PO
exec=cat /run/bc250/cpu_pout
custom_text=GPU PO
exec=cat /run/bc250/gpu_pout
custom_text=VRM P
exec=cat /run/bc250/total_power
# GDDR6 memory (optional --memory-temp service; see memory/README.md).
# Delete these two lines if you didn't install it — cat would otherwise
# show an error, since the files are never created in the first place.
custom_text=MEM MAX
exec=cat /run/bc250/memory_hotspot_c
custom_text=MEM AVG
exec=cat /run/bc250/memory_avg_c
